services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: entrivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entrivo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entrivo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entrivo_network

  # 2. Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: entrivo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entrivo_network

  # 3. Next.js Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entrivo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-entrivo}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_must_change_in_production}
      - QR_SIGNING_SECRET=${QR_SIGNING_SECRET:-default_qr_secret_must_change_in_prod}
      - CRON_SECRET=${CRON_SECRET:-default_cron_secret_must_change_in_prod}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-generate_32_byte_base64_encryption_key}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - entrivo_network

  # 4. Asynchronous Queue Worker (BullMQ Notifications & Webhooks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entrivo-worker
    restart: unless-stopped
    command: ["pnpm", "worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-entrivo}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_must_change_in_production}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-generate_32_byte_base64_encryption_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - entrivo_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  entrivo_network:
    driver: bridge

